 <!-- Preloader -->

  <section class="py-20 px-6 max-w-7xl mx-auto">

    <!-- Search + Filter -->
    <div class="flex flex-col md:flex-row md:justify-between items-center mb-10 space-y-4 md:space-y-0">
      <input id="searchInput" type="text" placeholder="Search articles..." class="px-4 py-2 w-full md:w-1/2 rounded bg-gray-800 text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-400">
      <select id="categoryFilter" class="px-4 py-2 rounded bg-gray-800 text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-400">

<nav class="fixed top-0 left-0 w-full bg-gray-800 bg-opacity-90 z-50 shadow-md">

      <img src="assets/images/logo.png" alt="YourTechBrand Logo" class="h-10 w-10 rounded-full border border-blue-400">

    <!-- Navigation Links -->
    <ul class="flex space-x-6 text-gray-300">

    </div>
    <p class="mt-4">&copy; 2025 YourTechBrand. All Rights Reserved.</p>

  <!-- BLOG POSTS JSON + SCRIPT -->
  <script>
    const blogPosts = [
      {
        title: "The Rise of Artificial Intelligence in Everyday Life",
        category: "AI",
        image: "images/ai-rise.jpg",
        excerpt: "Artificial Intelligence is no longer futuristic—it’s here, powering everything from chatbots to smart homes. In this article, we explore how AI is transforming daily life.",
        link: "#"
      },
      {
        title: "Cloud Security Best Practices for 2025",
        category: "Cloud",
        image: "images/cloud-security.jpg",
        excerpt: "With data breaches on the rise, businesses must adopt strong cloud security strategies. Here’s how to protect your digital assets effectively.",
        link: "#"
      },
      {
        title: "Cybersecurity Threats You Need to Know",
        category: "Cybersecurity",
        image: "images/threat.jpg",
        excerpt: "Hackers are becoming more sophisticated every year. This post covers the top cybersecurity threats to watch in 2025 and beyond.",
        link: "#"
      },
      {
        title: "How Startups Can Compete with Big Tech",
        category: "Startups",
        image: "images/startup.jpg",
        excerpt: "The startup world is full of challenges. We break down practical strategies for emerging businesses to stand out against tech giants.",
        link: "#"
      },
      {
        title: "Blockchain Beyond Cryptocurrency",
        category: "Blockchain",
        image: "images/block-currency.jpg",
        excerpt: "Blockchain is not just about Bitcoin—it’s revolutionizing industries from healthcare to logistics. Learn how businesses can harness this technology.",
        link: "#"
      }
    ];

    const blogGrid = document.getElementById("blogGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");

    function renderPosts(posts) {
      blogGrid.innerHTML = posts.map(post => `
        <div class="bg-gray-800 rounded-lg shadow-lg p-6 hover:shadow-cyan-500/50 transition">
          <img src="${post.image}" class="rounded mb-4" alt="${post.title}">
          <h3 class="text-2xl font-semibold text-cyan-400 mb-2">${post.title}</h3>
          <p class="text-gray-300 mb-3">${post.excerpt}</p>
          <a href="${post.link}" class="text-green-400 hover:text-cyan-400">Read More →</a>
        </div>
      `).join("");
    }

    function filterPosts() {
      const query = searchInput.value.toLowerCase();
      const category = categoryFilter.value;
      const filtered = blogPosts.filter(post =>
        (category === "all" || post.category === category) &&
        (post.title.toLowerCase().includes(query) || post.excerpt.toLowerCase().includes(query))
      );
      renderPosts(filtered);
    }

    searchInput.addEventListener("input", filterPosts);
    categoryFilter.addEventListener("change", filterPosts);

    renderPosts(blogPosts);
  </script>

  <!-- PRELOADER SCRIPT -->
  <script>
    window.addEventListener("load", function(){
      document.getElementById("preloader").style.display = "none";
    });
  </script>

  <script>
  // Preloader effect
  window.addEventListener("load", function () {
    document.body.classList.add("loaded");
  });

  // Page fade-in effect
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("fade-in");
  });

  // Smooth page transitions
  document.querySelectorAll("a").forEach(link => {
    if (link.hostname === window.location.hostname) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        const url = this.getAttribute("href");
        document.body.classList.remove("fade-in");
        setTimeout(() => {
          window.location.href = url;
        }, 300); // Delay for smooth transition
      });
    }
  });
</script>


</body>
</html>
